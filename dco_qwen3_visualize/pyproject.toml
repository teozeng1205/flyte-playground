[project]
name = "dco-qwen3-visualize"
version = "0.1.0"
description = "Flyte workflow for DCO Qwen3 embedding visualization"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.10.0",
    "boto3>=1.37.0",
    "flyte==2.0.2",
    "fsspec>=2025.2.0",
    "huggingface-hub>=0.34.4",
    "matplotlib>=3.10.0",
    "numpy>=2.2.0",
    "pandas>=2.2.0",
    "peft>=0.17.1",
    "plotly>=6.0.0",
    "pyarrow>=20.0.0",
    "s3fs>=2025.2.0",
    "scikit-learn>=1.5.0",
    "scipy>=1.14.0",
    "torch>=2.6.0",
    "transformers>=4.55.0",
    "umap-learn>=0.5.7",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["dco_qwen3_visualize*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
