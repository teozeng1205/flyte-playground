[project]
name = "dco-visualize"
version = "0.1.0"
description = "Flyte workflow for DCO tabular embeddings and visualization"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.37.0",
    "datashader>=0.18.2",
    "flyte==2.0.2",
    "fsspec>=2025.2.0",
    "huggingface-hub>=0.34.4",
    "hdbscan>=0.8.41",
    "joblib>=1.4.2",
    "matplotlib>=3.10.0",
    "numpy>=2.2.0",
    "pandas>=2.2.0",
    "plotly>=6.0.0",
    "pyarrow>=20.0.0",
    "rich>=14.1.0",
    "s3fs>=2025.2.0",
    "scikit-learn>=1.5.0",
    "scipy>=1.14.0",
    "seaborn>=0.13.2",
    "tabpfn>=2.1.3",
    "tabpfn-extensions>=0.1.8",
    "torch>=2.6.0",
    "umap-learn>=0.5.7",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["dco_visualize*"]

[tool.setuptools.package-data]
dco_visualize = ["data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
